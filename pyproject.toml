[project]
name = "bayrol-ha"
version = "0.1.0"
description = "Home Assistant custom integration for Bayrol pool controllers (Automatic SALT, Cl-pH, PoolManager)."
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
